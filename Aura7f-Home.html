<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clash of Clans Theme - Gallery Buttons</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Titan+One&display=swap');

    body {
      background: radial-gradient(circle, #3d6a2f 0%, #1c3614 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      gap: 28px;
      font-family: 'Titan One', cursive, sans-serif;
    }

    /* Base CoC Button */
    .coc-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 28px;
      font-size: 22px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #FFFFFF;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      border: 3.5px solid #1a0f05;
      border-radius: 14px;
      transition: all 0.08s ease-in-out;
      
      /* Comic text stroke & inner text shadow */
      -webkit-text-stroke: 1.5px #111;
      text-shadow: 
        0 3px 0 #000,
        0 -1px 0 #000,
        1px 0 0 #000,
        -1px 0 0 #000;
    }

    /* Top Highlight Rim */
    .coc-btn::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 6px;
      right: 6px;
      height: 38%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.05) 100%);
      border-radius: 8px 8px 12px 12px;
      pointer-events: none;
    }

    /* --- Theme 1: Golden Yellow (Classic Shop Style) --- */
    .coc-btn-gold {
      background: linear-gradient(180deg, #ffdf43 0%, #f39c12 50%, #c0392b 100%);
      box-shadow: 
        inset 0 2px 0 rgba(255, 255, 255, 0.6),
        inset 0 -4px 0 #7e1d13,
        0 6px 0 #3a1c06,
        0 10px 8px rgba(0, 0, 0, 0.45);
    }
    .coc-btn-gold:active {
      transform: translateY(5px);
      box-shadow: 
        inset 0 2px 0 rgba(255, 255, 255, 0.4),
        inset 0 -2px 0 #7e1d13,
        0 1px 0 #3a1c06,
        0 3px 4px rgba(0, 0, 0, 0.4);
    }

    /* --- Theme 2: Elixir Purple / Pink --- */
    .coc-btn-elixir {
      background: linear-gradient(180deg, #ff71ce 0%, #d81182 50%, #6e0049 100%);
      box-shadow: 
        inset 0 2px 0 rgba(255, 255, 255, 0.6),
        inset 0 -4px 0 #3b0027,
        0 6px 0 #200215,
        0 10px 8px rgba(0, 0, 0, 0.45);
    }
    .coc-btn-elixir:active {
      transform: translateY(5px);
      box-shadow: 
        inset 0 2px 0 rgba(255, 255, 255, 0.4),
        inset 0 -2px 0 #3b0027,
        0 1px 0 #200215,
        0 3px 4px rgba(0, 0, 0, 0.4);
    }

    /* --- Theme 3: Gem Green --- */
    .coc-btn-green {
      background: linear-gradient(180deg, #8ae922 0%, #43a012 50%, #1e5a08 100%);
      box-shadow: 
        inset 0 2px 0 rgba(255, 255, 255, 0.6),
        inset 0 -4px 0 #0f3504,
        0 6px 0 #081a02,
        0 10px 8px rgba(0, 0, 0, 0.45);
    }
    .coc-btn-green:active {
      transform: translateY(5px);
      box-shadow: 
        inset 0 2px 0 rgba(255, 255, 255, 0.4),
        inset 0 -2px 0 #0f3504,
        0 1px 0 #081a02,
        0 3px 4px rgba(0, 0, 0, 0.4);
    }

    /* --- Theme 4: Circular HUD Icon Button --- */
    .coc-btn-icon {
      width: 76px;
      height: 76px;
      padding: 0;
      border-radius: 50%;
      background: linear-gradient(180deg, #ffde43 0%, #e67e22 50%, #a93226 100%);
      box-shadow: 
        inset 0 2px 0 rgba(255, 255, 255, 0.6),
        inset 0 -4px 0 #5c1710,
        0 6px 0 #2a1102,
        0 10px 8px rgba(0, 0, 0, 0.45);
    }
    .coc-btn-icon::before {
      top: 3px;
      left: 12px;
      right: 12px;
      height: 42%;
      border-radius: 50% 50% 40% 40%;
    }
    .coc-btn-icon:active {
      transform: translateY(5px);
      box-shadow: 
        inset 0 2px 0 rgba(255, 255, 255, 0.4),
        inset 0 -2px 0 #5c1710,
        0 1px 0 #2a1102,
        0 3px 4px rgba(0, 0, 0, 0.4);
    }

    /* SVG Icon Styling */
    .btn-svg {
      width: 28px;
      height: 28px;
      filter: drop-shadow(0 2px 0 #000);
    }
  </style>
</head>
<body>

  <!-- Classic Gold Gallery Button -->
  <button class="coc-btn coc-btn-gold">
    <svg class="btn-svg" viewBox="0 0 24 24" fill="#FFFFFF">
      <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
    </svg>
    <span>Gallery</span>
  </button>

  <!-- Elixir Style Button -->
  <button class="coc-btn coc-btn-elixir">
    <svg class="btn-svg" viewBox="0 0 24 24" fill="#FFFFFF">
      <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/>
    </svg>
    <span>Photos</span>
  </button>

  <!-- Gem Green Style Button -->
  <button class="coc-btn coc-btn-green">
    <svg class="btn-svg" viewBox="0 0 24 24" fill="#FFFFFF">
      <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
    </svg>
    <span>View Gallery</span>
  </button>

  <!-- Circular Bottom-Right HUD Style Button -->
  <button class="coc-btn coc-btn-icon" title="Open Gallery">
    <svg class="btn-svg" style="width: 36px; height: 36px;" viewBox="0 0 24 24" fill="#FFFFFF">
      <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
    </svg>
  </button>

</body>
</html>
